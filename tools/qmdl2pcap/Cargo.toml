[package]
name = "qmdl2pcap"
version = "0.1.0"
edition = "2021"

[dependencies]
rayhunter = { git = "https://github.com/South-Lighthouse/rayhunter", branch = "lac-round-two", package = "rayhunter" }
tokio = { version = "1", features = ["rt", "macros", "fs", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
