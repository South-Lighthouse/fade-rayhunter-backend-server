<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #333; }
  .report { max-width: 900px; margin: 0 auto; }
  .report-header h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .report-header .subtitle { color: #888; font-size: 0.875rem; margin: 0 0 20px; }

  .card-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin: 0 0 14px; }
  .chart-empty { color: #aaa; font-size: 0.875rem; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
